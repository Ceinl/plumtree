name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check whitespace
        run: git diff --check
      - name: Check embedded build assets
        run: |
          go generate ./internal/build
          git diff --exit-code -- internal/build/bundle.tar.gz
      - name: Vet workspace modules
        run: ./scripts/workspace-check.sh vet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Test workspace modules
        run: ./scripts/workspace-check.sh test
      - name: Test workspace modules with race detector
        run: ./scripts/workspace-check.sh race

  consolidation-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Check consolidation guardrails
        run: ./scripts/check-consolidation-guardrails.sh
      - name: Test frozen ABI with workspace disabled
        working-directory: internal/runner
        run: GOWORK=off go test -run '^TestBaselineABIV4CounterArtifact$' .

  native-release-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Install target-native SQLCipher toolchain
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev libssl-dev openssh-client
      - name: Build target-native release binaries
        env:
          CC: gcc
          OPENSSL_PREFIX: /usr
          SQLCIPHER_INCLUDE: /usr/include/sqlcipher
          SQLCIPHER_LIBRARY: sqlcipher
          SQLCIPHER_PREFIX: /usr
        run: ./scripts/build-native-release.sh dist/native
      - name: Run fresh native release journey
        env:
          PLUMTREE_QUALIFY_PT: ${{ github.workspace }}/dist/native/pt
          PLUMTREE_QUALIFY_RUNNER_WORKER: ${{ github.workspace }}/dist/native/runner-worker
          PLUMTREE_QUALIFY_SERVER: ${{ github.workspace }}/dist/native/plumtree
        run: go test -tags qualification ./test/qualification -run '^TestNativeReleaseJourney$' -count=1 -v

  compose-release-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Install target-native SQLCipher toolchain
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev libssl-dev openssh-client
      - name: Build target-native author binary
        env:
          CC: gcc
          OPENSSL_PREFIX: /usr
          SQLCIPHER_INCLUDE: /usr/include/sqlcipher
          SQLCIPHER_LIBRARY: sqlcipher
          SQLCIPHER_PREFIX: /usr
        run: ./scripts/build-native-release.sh dist/native
      - name: Run fresh Compose production journey
        env:
          PLUMTREE_QUALIFY_PT: ${{ github.workspace }}/dist/native/pt
          PLUMTREE_QUALIFY_REPOSITORY: ${{ github.workspace }}
        run: go test -tags qualification ./test/qualification -run '^TestComposeReleaseJourney$' -count=1 -v

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release asset contract
        run: |
          mkdir dist
          assets=(
            pt-linux-amd64
            pt-linux-arm64
            pt-darwin-amd64
            pt-darwin-arm64
            pt-windows-amd64.exe
            plumtree-linux-amd64
            plumtree-linux-arm64
            plumtree-darwin-amd64
            plumtree-darwin-arm64
            plumtree-windows-amd64.exe
          )
          for asset in "${assets[@]}"; do
            printf 'release-contract-fixture\n' > "dist/$asset"
          done
          (cd dist && sha256sum pt-* plumtree-* > checksums.txt)
          ./scripts/check-release-contract.sh dist
          (cd dist && sha256sum --check checksums.txt)
