name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check whitespace
        run: git diff --check
      - name: Check embedded build assets
        run: |
          go generate ./internal/build
          git diff --exit-code -- internal/build/bundle.tar.gz
      - name: Vet workspace modules
        run: ./scripts/workspace-check.sh vet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Test workspace modules
        run: ./scripts/workspace-check.sh test
      - name: Test workspace modules with race detector
        run: ./scripts/workspace-check.sh race

  consolidation-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Check consolidation guardrails
        run: ./scripts/check-consolidation-guardrails.sh
      - name: Test frozen ABI with workspace disabled
        working-directory: internal/runner
        run: GOWORK=off go test -run '^TestBaselineABIV4CounterArtifact$' .

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum
      - name: Cross-build release assets
        run: ./scripts/build-release.sh dist
      - name: Verify release asset contract
        run: ./scripts/check-release-contract.sh dist
      - name: Verify checksums
        run: (cd dist && sha256sum --check checksums.txt)
