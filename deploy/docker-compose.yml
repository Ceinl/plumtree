# Compose deployment: control and gateway share the public SSH process. Hosted
# WASM runs behind an authenticated Unix socket in a networkless runner.
services:
  plumtree:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.plumtree
    user: "${PLUMTREE_UID:?set PLUMTREE_UID to id -u}:${PLUMTREE_GID:?set PLUMTREE_GID to id -g}"
    restart: unless-stopped
    ports:
      - "${PLUMTREE_SSH_PUBLISH_ADDR:-0.0.0.0:2222}:2222"
    environment:
      PLUMTREE_STORAGE_DATABASE_PATH: /data/plumtree.db
      PLUMTREE_STORAGE_KV_ROOT: /data/plumtree-data
      PLUMTREE_STORAGE_SSH_IDENTITY: /data/plumtree_host_key
      PLUMTREE_ROLES_CONTROL: "true"
      PLUMTREE_ROLES_GATEWAY: "true"
      PLUMTREE_ROLES_RUNNER: "false"
      PLUMTREE_RUNTIME_RUNNER_ENDPOINT: unix:///run/plumtree/runner.sock
      PLUMTREE_RUNTIME_PRODUCTION: "true"
      PLUMTREE_SECRETS_DATABASE_KEY_FILE: /run/secrets/database-key
      PLUMTREE_SECRETS_GATEWAY_TOKEN_FILE: /run/secrets/runner-token
    volumes:
      - ${PLUMTREE_DATA_PATH:-./data}:/data
      - ${PLUMTREE_RUNNER_SOCKET_PATH:-./runner-socket}:/run/plumtree
      - ${PLUMTREE_DATABASE_KEY_FILE:-./database.key}:/run/secrets/database-key:ro
      - ${PLUMTREE_RUNNER_TOKEN_FILE:-./runner.token}:/run/secrets/runner-token:ro
    command:
      - serve
      - -config
      - /etc/plumtree/config.json
      - -storage-database-path
      - /data/plumtree.db
      - -storage-kv-root
      - /data/plumtree-data
      - -storage-ssh-identity
      - /data/plumtree_host_key
      - -exposure-ssh-address
      - :2222
      - -roles-control
      - "true"
      - -roles-gateway
      - "true"
      - -roles-runner
      - "false"
      - -runtime-runner-endpoint
      - unix:///run/plumtree/runner.sock
      - -runtime-production
      - "true"
      - -secrets-database-key-file
      - /run/secrets/database-key
      - -secrets-gateway-token-file
      - /run/secrets/runner-token
      - -product-version
      - ${PLUMTREE_PRODUCT_VERSION:-dev}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256

  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.plumtree
    user: "${PLUMTREE_UID:?set PLUMTREE_UID to id -u}:${PLUMTREE_GID:?set PLUMTREE_GID to id -g}"
    restart: unless-stopped
    network_mode: none
    environment:
      PLUMTREE_ROLES_CONTROL: "false"
      PLUMTREE_ROLES_GATEWAY: "false"
      PLUMTREE_ROLES_RUNNER: "true"
      PLUMTREE_RUNTIME_RUNNER_ENDPOINT: unix:///run/plumtree/runner.sock
      PLUMTREE_RUNTIME_RUNNER_WORKER: /usr/local/bin/runner-worker
      PLUMTREE_RUNTIME_RUNNER_SCRATCH_ROOT: /run/plumtree-sessions
      PLUMTREE_RUNTIME_PRODUCTION: "true"
      PLUMTREE_SECRETS_RUNNER_TOKEN_FILE: /run/secrets/runner-token
    volumes:
      - ${PLUMTREE_RUNNER_SOCKET_PATH:-./runner-socket}:/run/plumtree
      - ${PLUMTREE_RUNNER_SCRATCH_PATH:-./runner-scratch}:/run/plumtree-sessions
      - ${PLUMTREE_RUNNER_TOKEN_FILE:-./runner.token}:/run/secrets/runner-token:ro
    command:
      - serve
      - -config
      - /etc/plumtree/config.json
      - -roles-control
      - "false"
      - -roles-gateway
      - "false"
      - -roles-runner
      - "true"
      - -runtime-runner-endpoint
      - unix:///run/plumtree/runner.sock
      - -runtime-runner-worker
      - /usr/local/bin/runner-worker
      - -runtime-runner-scratch-root
      - /run/plumtree-sessions
      - -runtime-production
      - "true"
      - -secrets-runner-token-file
      - /run/secrets/runner-token
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: 2.0
    mem_limit: 1024m
    pids_limit: 256
