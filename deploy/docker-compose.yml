# Native Compose deployment: one root-owned Plumtree process and one
# persistent SQLite volume. Only the SSH control transport is published.
services:
  plumtree:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.plumtree
    restart: unless-stopped
    ports:
      - "${PLUMTREE_SSH_PUBLISH_ADDR:-0.0.0.0:2222}:2222"
    volumes:
      - plumtree-data:/data
    command:
      - -database
      - /data/plumtree.db
      - -host-key
      - /data/plumtree_host_key
      - -ssh-addr
      - :2222
      - -product-version
      - ${PLUMTREE_PRODUCT_VERSION:-dev}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256

volumes:
  plumtree-data:
